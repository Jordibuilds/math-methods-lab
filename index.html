    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">' + (icons[name] || "") + "</svg>";
  }
  function attrs(data = {}) {
    return Object.entries(data).map(([key,value]) => ' data-' + key + '="' + M.escape(value) + '"').join("");
  }
  function button(action,text,options = {}) {
    const {className="",iconName="",data={},disabled=false,title="",pressed} = options;
    return '<button type="button" class="action ' + className + '"' + attrs({action,...data})
      + (title ? ' title="' + M.escape(title) + '"' : "")
      + (pressed === undefined ? "" : ' aria-pressed="' + pressed + '"')
      + (disabled ? " disabled" : "") + ">" + (iconName ? icon(iconName) : "") + M.escape(text) + "</button>";
  }

  function iconButton(action,iconName,label,data={}) {
    const escaped = M.escape(label);
    return '<button type="button" class="icon-button"' + attrs({action,...data}) + ' title="' + escaped
      + '" aria-label="' + escaped + '">' + icon(iconName) + "</button>";
  }

  function newCase() { return {id:id(),title:"",condition:[],result:[]}; }
  function newBlock(kind) {
    const base = {id:id(),kind,selected:false};
    switch (kind) {
      case "math": return {...base,expression:[]};
      case "matrix": return {...base,rows:2,cols:2,cells:[[[],[]],[[],[]]]};
      case "note": return {...base,text:""};
      case "case": return {...base,cases:[newCase()]};
      case "graph": return {...base,mode:"point",label:"",shapes:[],pending:[],plotSource:"",
        xLabel:"x",yLabel:"y",xMin:0,xMax:10,yMin:0,yMax:10,snap:false,axesOpen:false};
      default: throw Error("Unknown block type");
    }
  }

  function activeExercise() {
    if (state.section === "skills") {
      const drillGroup = skills.find(group => group.key === state.mode);
      const list = drillGroup?.drills || skills.flatMap(group => group.drills);
      return {sectionKey:"s-" + state.mode,list,chapter:null};
    }
    const chapter = chapters.find(item => "c" + item.number === state.section) || chapters[0];
    return {sectionKey:"c" + chapter.number,chapter,list:chapter.exercises};
  }

  function resolve() {
    const context = activeExercise();
    const {sectionKey,list,chapter} = context;
    const exerciseIndex = Math.min(list.length-1,Math.max(0,state.choices[sectionKey] || 0));
    const definition = list[exerciseIndex];
    const baseKey = sectionKey + "-" + exerciseIndex;
    const version = state.variants[baseKey] || 0;
    const generated = definition.build(version);
    const key = baseKey + "-" + version;
    state.attempts[key] ||= {blocks:[newBlock("math")],part:0,passed:{},feedback:{}};
    return {...context,baseKey,key,chapter,exerciseIndex,definition,version,generated,attempt:state.attempts[key]};
  }

  function navigation() {
    const selected = state.section;
    const brand = '<span class="brand-icon">' + icon("brand") + "</span>";
    const options = chapters.map((chapter,index) => '<option value="c' + chapter.number + '"' + (selected === "c"+chapter.number ? " selected" : "")
      + ">" + pad(chapter.number) + " · " + M.escape(chapterNavLabels[index]) + "</option>").join("");
    const chapterButtons = chapters.map((chapter,index) => {
      const key = "c" + chapter.number;
      const current = selected === key;
      return '<button type="button" class="nav-button' + (current ? " is-active" : "") + '"' + attrs({action:"navigate",section:key})
        + (current ? ' aria-current="page"' : "") + ' title="' + M.escape(chapter.label) + '"><span class="nav-number">'
        + pad(chapter.number) + "</span><span>" + M.escape(chapterNavLabels[index]) + "</span></button>";
    }).join("");
    return '<aside class="sidebar"><div class="brand">' + brand + '<div><div class="brand-name">Math Methods Lab</div>'
      + '<p class="brand-context">Business and Economics</p></div></div><nav aria-label="Chapter tabs">'
      + '<span class="nav-title">Chapters</span><div class="chapter-list">' + chapterButtons + "</div>"
      + '<div class="skill-nav"><button type="button" class="nav-button nav-skill' + (selected === "skills" ? " is-active" : "")
      + '" data-action="navigate" data-section="skills"' + (selected === "skills" ? ' aria-current="page"' : "") + '>'
      + '<span class="nav-skill-icon">' + icon("skills") + "</span><span>Skills Practice</span></button></div></nav>"
      + '<p class="sidebar-foot">University of Hohenheim · Course exercises</p></aside>'
      + '<div class="mobile-nav"><div class="mobile-brand">' + brand + 'Math Methods Lab</div>'
      + '<select data-change="mobile-nav" aria-label="Choose chapter or Skills Practice">' + options
      + '<option value="skills"' + (selected === "skills" ? " selected" : "") + ">Skills Practice</option></select></div>";
  }

  function renderPage() {
    active = resolve();
    message = null;
    const {chapter,definition,version,list,exerciseIndex} = active;
    const heading = chapter ? chapter.label : "Skills Practice";
    const subtitle = chapter ? "Chapter " + pad(chapter.number) : "Supplementary practice";
    const categories = chapter ? "" : '<nav class="skill-categories" aria-label="Skills">'
      + [...skills,{key:"mixed",label:"Mixed"}].map(group => exerciseChip("skill-mode",group.label,group.key,state.mode===group.key)).join("") + "</nav>";
    const chips = list.length > 1
      ? '<nav class="exercise-nav" aria-label="' + (chapter ? "Exercises" : "Drills") + '">'
        + list.map((item,index) => exerciseChip("choose-exercise",item.title,index,index===exerciseIndex,chapter ? index+1 : "")).join("") + "</nav>"
      : "";
    const actions = version ? button("original","Original",{className:"action-quiet"}) : "";
    const canRotate = definition.variants;
    const rotateLabel = chapter ? "New variant" : (state.mode === "mixed" ? "New drill" : "New numbers");
    root.innerHTML = '<div class="app-shell">' + navigation() + '<main class="main" id="main">'
      + '<header class="chapter-header"><div><p class="eyebrow">' + M.escape(subtitle) + '</p><h1>' + M.escape(heading) + "</h1></div>"
      + '<div class="header-actions">' + actions
      + (canRotate ? button("variant",rotateLabel,{iconName:"refresh",className:"action-soft"}) : "") + "</div></header>"
      + categories + chips + '<div class="work-grid"><section id="problem" class="card problem" aria-label="Exercise prompt"></section>'
      + '<section class="card workspace" aria-label="Workspace"><div class="workspace-head"><h2>Workspace</h2><span class="workspace-status" id="storage-status"></span></div>'
      + '<div class="workspace-tools" aria-label="Add to workspace">' + Object.entries(labels)
        .map(([kind,label]) => button("add-block",label,{className:"action-small",iconName:kind==="math"?"equation":kind==="case"?"cases":kind,data:{kind},title:"Add "+label.toLowerCase()})).join("")
      + '</div><div class="sheet" id="sheet"></div><div class="keypad" id="keypad"></div><div class="checking" id="checking"></div></section></div>'
      + '<p class="help-strip">Select a subquestion to check it. To check specific lines, click their numbers in the workspace.</p></main></div>';
    setDefaultFocus();
    renderProblem();
    renderSheet();
    renderKeypad();
    renderCheck();
    save();
  }

  function exerciseChip(action,title,value,current,index="") {
    return '<button type="button" class="exercise-chip' + (current ? " is-active" : "") + '" aria-pressed="' + current + '"'
      + attrs({action,value}) + ">" + (index ? '<span class="chip-index">' + index + "</span>" : "") + M.escape(title) + "</button>";
  }

  function viewMatrix(rows) {
    return '<span class="math-matrix"><table aria-label="Matrix"><tbody>' + rows.map(row =>
      "<tr>" + row.map(cell => "<td>" + M.format(String(cell)) + "</td>").join("") + "</tr>").join("") + "</tbody></table></span>";
  }

  function displayGiven(given,index,copy=true) {
    const rendered = given.rows ? '<span class="math">' + M.label(given.name) + " = " + viewMatrix(given.rows) + "</span>" : M.format(given.code);
    return '<div class="given-line">' + rendered + (copy ? (given.rows
      ? iconButton("insert-given","copy","Copy matrix to workspace",{index})
      : iconButton("insert-given","copy","Copy formula to workspace",{index})) : "") + "</div>";
  }

  function renderProblem() {
    const {chapter,generated,attempt,exerciseIndex,version} = active;
    const heading = chapter ? "Exercise " + (exerciseIndex+1) : "Drill";
    const status = version ? "Variant " + version : (chapter ? "Original" : "Practice");
    const total = generated.parts.length;
    const checked = Object.values(attempt.passed).filter(Boolean).length;
    const givens = generated.givens.length ? '<div class="givens">' + generated.givens.map((given,index) => displayGiven(given,index)).join("") + "</div>" : "";
    const parts = generated.parts.map((item,index) => {
      const current = attempt.part === index;
      const done = attempt.passed[index];
      return '<div><button type="button" class="part-button' + (current?" is-active":"") + '" aria-pressed="' + current
        + '"' + attrs({action:"choose-part",part:index}) + '><span class="part-letter' + (done?" checked":"") + '">'
        + (done ? "✓" : alphabet[index]) + "</span><span>" + M.rich(item.question) + "</span></button>"
        + (item.target ? '<details class="target"><summary>Show target from the sheet</summary><div class="givens">'
          + item.target.map(given => displayGiven(given,0,false)).join("") + "</div></details>" : "") + "</div>";
    }).join("");
    document.getElementById("problem").innerHTML = '<div class="problem-kicker"><span>' + heading + '</span><span class="problem-version'
      + (version ? " variant" : "") + '">' + status + "</span></div><h2>" + M.escape(generated.title) + "</h2>"
      + (generated.intro ? '<p class="problem-description">' + M.rich(generated.intro) + "</p>" : "") + givens
      + '<div class="parts-heading"><span>' + (total === 1 ? "Question" : "Subquestions") + '</span><span class="part-count">'
      + checked + " of " + total + ' checked</span></div><div class="part-list">' + parts + "</div>"
      + (chapter ? '<p class="source">Course exercises · ' + M.escape(chapter.section) + (version ? " · Practice values" : "") + "</p>" : "");
  }

  function blockById(value) { return active.attempt.blocks.find(block => block.id === value); }
  function firstField(block) {
    if (block.kind === "math") return "expression";
    if (block.kind === "matrix") return "m:0:0";
    if (block.kind === "case") return "c:" + block.cases[0].id + ":condition";
    return null;
  }

  function rootSequence(block,field) {
    if (!block) return null;
    if (field === "expression") return block.expression;
    const [type,a,b] = field.split(":");
    if (type === "m") return block.cells?.[Number(a)]?.[Number(b)];
    if (type === "c") return block.cases?.find(item => item.id === a)?.[b];
    return null;
  }

  function sequenceAt(block,field,path) {
    let seq = rootSequence(block,field);
    for (let i=0; seq && i<path.length; i+=2) seq = seq[Number(path[i])]?.[path[i+1]];
    return seq;
  }

  function setDefaultFocus() {
    const block = active.attempt.blocks.find(item => firstField(item));
    const field = block && firstField(block);
    focus = field ? {block:block.id,field,path:[],offset:rootSequence(block,field).length} : null;
  }

  function setFocus(block,field,path=[],offset=null) {
    const seq = sequenceAt(block,field,path);
    if (!seq) return;
    focus = {block:block.id,field,path,offset:Math.max(0,Math.min(seq.length,offset ?? seq.length))};
  }

  function nodeSlots(token) {
    switch (token.kind) {
      case "frac": return ["top","bottom"];
      case "root": case "power": case "sub": case "group": return ["body"];
      case "nthroot": return ["index","body"];
      case "call": return Array.from({length:token.count},(_,i) => "arg"+i);
      default: return [];
    }
  }

  function sequenceMarkup(block,field,seq,path) {
    const pathText = path.join(".");
    const at = focus?.block === block.id && focus.field === field && focus.path.join(".") === pathText;
    let html = "";
    const caret = '<span class="caret" aria-hidden="true"></span>';
    for (let i=0; i<=seq.length; i+=1) {
      if (at && focus.offset === i) html += caret;
      if (i<seq.length) html += '<span class="math-atom" data-atom="' + i + '">' + atomMarkup(seq[i],block,field,[...path,i]) + "</span>";
    }
    return '<span class="math-sequence' + (!path.length?" root-sequence":"") + (!seq.length?" is-empty":"")
      + (at?" is-slot-active":"") + '"' + attrs({sequence:pathText,block:block.id,field}) + ">" + html + "</span>";
  }

  function atomMarkup(token,block,field,path) {
    if (token.kind === "text") {
      const value = token.value;
      if (/^[A-Za-z][A-Za-z0-9_]*$/.test(value)) return M.label(value);
      const op = M.visibleOps[value] || value;
      return /^[=<>+*/-]+$/.test(value) || value in M.visibleOps ? '<span class="math-op">' + M.escape(op) + "</span>" : M.escape(op);
    }
    const slot = key => sequenceMarkup(block,field,token[key], [...path,key]);
    switch (token.kind) {
      case "frac": return M.fraction(slot("top"),slot("bottom"));
      case "root": return M.radical(slot("body"));
      case "nthroot": return M.radical(slot("body"),slot("index"));
      case "power": return '<span class="sup-slot">' + slot("body") + "</span>";
      case "sub": return '<span class="sub-slot">' + slot("body") + "</span>";
      case "group": return "(" + slot("body") + ")";
      case "call": {
        const args = nodeSlots(token).map(slot);
        switch(token.name) {
          case "D": return M.fraction("∂" + args[0], "∂" + args[1]);
          case "D2": return M.fraction("∂²" + args[0], "∂" + args[1] + " ∂" + args[2]);
          case "diff": return M.fraction("d" + args[0], "d" + args[1]);
          case "prime": return args[0] + "′(" + args[1] + ")";
          case "abs": return "|" + args[0] + "|";
          default: return M.escape(token.name) + "(" + args.join(", ") + ")";
        }
      }
      default: return "";
    }
  }

  function entry(block,field,label,placeholder="") {
    const seq = rootSequence(block,field);
    return '<div class="entry" tabindex="0" role="textbox" aria-label="' + M.escape(label) + '"' + attrs({entry:block.id,field}) + ">"
      + (seq.length ? "" : '<span class="entry-placeholder">' + M.escape(placeholder) + "</span>")
      + sequenceMarkup(block,field,seq,[]) + "</div>";
  }

  function blockIndex(block,index) {
    return '<button type="button" class="block-index" aria-label="Select line ' + (index+1)
      + ' for checking" aria-pressed="' + block.selected + '"' + attrs({action:"select-block",block:block.id}) + ">" + (index+1) + "</button>";
  }

  function blockControls(block,index) {
    return '<div class="block-controls">' + iconButton("duplicate-block","copy","Duplicate line "+(index+1),{block:block.id})
      + iconButton("remove-block","remove","Delete line "+(index+1),{block:block.id}) + "</div>";
  }

  function renderBlock(block,index) {
    const appearance = (focus?.block === block.id ? " is-focused" : "") + (block.selected ? " is-selected" : "");
    const content = block.kind === "math"
      ? '<div class="block-line">' + blockIndex(block,index) + entry(block,"expression","Equation line "+(index+1),"Click a math key to start")
        + blockControls(block,index) + "</div>"
      : '<div class="block-heading">' + blockIndex(block,index) + "<strong>" + labels[block.kind] + "</strong>"
        + blockControls(block,index) + '</div><div class="block-body">' + blockContent(block) + "</div>";
    return '<section class="block' + appearance + '"' + attrs({"block-box":block.id}) + ">" + content + "</section>";
  }

  function blockContent(block) {
    if (block.kind === "note") {
      return '<textarea data-input="note"' + attrs({block:block.id}) + ' aria-label="Written reasoning" placeholder="Write your reasoning here">' + M.escape(block.text) + "</textarea>";
    }
    if (block.kind === "matrix") return matrixEditor(block);
    if (block.kind === "case") return casesEditor(block);
    return graphEditor(block);
  }

  function matrixEditor(block) {
    const sizes = name => [1,2,3,4].map(size => '<option value="' + size + '"' + (block[name]===size ? " selected" : "") + ">" + size + "</option>").join("");
    const select = (name,label) => "<label><span>" + label + '</span><select data-change="matrix-size"' + attrs({block:block.id,name}) + ">" + sizes(name) + "</select></label>";
    const grid = block.cells.map((row,i) => "<tr>" + row.map((_,j) => "<td>" + entry(block,"m:"+i+":"+j,"Matrix row "+(i+1)+", column "+(j+1)) + "</td>").join("") + "</tr>").join("");
    return '<div class="matrix-options">' + select("rows","Rows") + select("cols","Columns") + '</div><div class="matrix-scroll"><div class="math-matrix matrix-input"><table aria-label="Editable matrix"><tbody>'
      + grid + "</tbody></table></div></div>";
  }

  function casesEditor(block) {
    const rows = block.cases.map((item,index) => {
      const fields = ["condition","result"].map(field => {
        const label = field === "condition" ? "Conditions" : "Result";
        return '<div class="case-field"><span>' + label + "</span>" + entry(block,"c:"+item.id+":"+field,"Case "+(index+1)+" "+label.toLowerCase()) + "</div>";
      }).join("");
      return '<div class="case-row"><div class="case-title"><input type="text" data-input="case-title"' + attrs({block:block.id,case:item.id})
        + ' aria-label="Case name" placeholder="Case ' + (index+1) + '" value="' + M.escape(item.title) + '">'
        + (block.cases.length > 1 ? iconButton("remove-case","remove","Delete case "+(index+1),{block:block.id,case:item.id}) : "")
        + "</div>" + fields + "</div>";
    }).join("");
    return rows + button("add-case","Add case",{className:"action-small",iconName:"plus",data:{block:block.id}});
  }

  function bringFocus() {
    if (!focus) return;
    const element = Array.from(document.querySelectorAll("[data-entry]")).find(item => item.dataset.entry === focus.block && item.dataset.field === focus.field);
    if (!element) return;
    element.focus({preventScroll:true});
    const caret = element.querySelector(".caret");
    if (caret) {
      const before = element.getBoundingClientRect();
      const position = caret.getBoundingClientRect().left;
      if (position > before.right - 12) element.scrollLeft += position - before.right + 19;
      if (position < before.left) element.scrollLeft -= before.left - position + 12;
    }
  }

  function renderSheet(restoreFocus=false) {
    const sheet = document.getElementById("sheet");
    sheet.innerHTML = active.attempt.blocks.map(renderBlock).join("");
    if (restoreFocus) bringFocus();
  }

  function mathKey(value,visible,label,className="",action="insert-key") {
    return '<button type="button" class="key '+className+'"' + attrs({action,value})
      + ' aria-label="' + M.escape(label) + '" title="' + M.escape(label) + '">' + visible + "</button>";
  }

  function renderKeypad() {
    const palette = document.getElementById("keypad");
    const numberKeys = [..."1234567890","."].map(key => mathKey(key,M.escape(key),key==="."?"Decimal point":key)).join("");
    const operations = [["+", "+", "Plus"],["-","−","Minus"],["*","×","Multiply"],["=","=","Equals"],
      ["group","(□)","Parentheses"],["frac",'<span class="key-fraction"><span>□</span><span>□</span></span>',"Fraction"],
      ["power","x<sup>□</sup>","Power"],["root","√□","Square root"]]
      .map(([value,visible,label]) => mathKey(value,visible,label,"operator template")).join("");
    const basicSymbols = [...new Set([...active.generated.symbols,"x","y"])].slice(0,24).map(symbol =>
      mathKey(symbol,M.format(symbol),symbol.replace(/_/g," "),"symbol-key", "insert-symbol")).join("");
    const more = [["<","&lt;","Less than"],[">","&gt;","Greater than"],["<=","≤","Less than or equal to"],
      [">=","≥","Greater than or equal to"],["!=","≠","Not equal to"],["~=","≈","Approximately equal"],
      [",",",","Comma"],["sub","x<sub>□</sub>","Subscript"],["nthroot","ⁿ√□","Nth root"],["ln","ln","Natural logarithm"],
      ["exp","e<sup>□</sup>","Exponential function"],["abs","|□|","Absolute value"],["D","∂/∂","Partial derivative"],
      ["D2","∂²/∂","Second partial derivative"],["diff","d/d","Ordinary derivative"],["prime","f′","Prime notation"]]
      .map(([value,visible,label]) => mathKey(value,visible,label,"operator template")).join("");
    const greeks = Object.entries(M.greek).filter(([key])=>key!=="Delta")
      .map(([symbol,glyph]) => mathKey(symbol,glyph,symbol,"symbol-key","insert-symbol")).join("");
    const letters = Array.from(keypadPage==="upper"?alphabet.toUpperCase():alphabet).map(symbol =>
      mathKey(symbol,M.label(symbol),symbol,"symbol-key","insert-symbol")).join("");
    const hasLetters = ["lower","upper"].includes(keypadPage);
    const keyboardView = keypadPage==="basic" ? basicSymbols : hasLetters
      ? mathKey(keypadPage==="upper"?"lower":"upper",keypadPage==="upper"?"Lowercase":"Uppercase",
        keypadPage==="upper"?"Lowercase letters":"Uppercase letters","word","keypad-page") + letters : more + greeks;
    const editing = [["next","Next slot"],["out","Exit slot"],["back","Delete symbol"]]
      .map(([value,name]) => mathKey(value,M.escape(name),name,"word","slot-control")).join("");
    palette.innerHTML = '<div class="keypad-head"><span class="keypad-title">Math keyboard</span><div class="keypad-tabs">'
      + [["basic","Symbols"],["more","Notation"],["lower","Letters"]].map(([value,name]) => '<button type="button" class="keypad-tab" aria-pressed="'
        + (keypadPage===value || (value==="lower"&&hasLetters)) + '"' + attrs({action:"keypad-page",value}) + ">" + name + "</button>").join("") + "</div></div>"
      + '<div class="keys">' + numberKeys + operations + '</div><div class="keys">' + keyboardView
      + '</div><div class="keys">' + editing + "</div>";
  }

  function markupMessage(feedback, part) {
    if (!feedback) return "";
    const className = feedback.kind === "correct" ? " good" : (feedback.kind === "retry" ? " try" : "");
    let display = '<div class="feedback' + className + '" role="status"><p>' + M.escape(feedback.text) + "</p>";
    if (feedback.hint) display += "<p>" + M.rich(part.hint) + "</p>";
    if (feedback.solution) {
      display += "<p>" + M.rich(part.answer) + "</p>";
      if (!part.checks.length) display += button("mark-reviewed","Mark reviewed",{className:"action-small action-soft"});
    }
    return display + "</div>";
  }

  function renderCheck() {
    const {attempt,generated} = active;
    const part = generated.parts[attempt.part];
    const selected = attempt.blocks.filter(block => block.selected).length;
    const feedback = message || attempt.feedback[attempt.part];
    document.getElementById("checking").innerHTML = '<div class="check-actions"><div class="check-context">'
      + (generated.parts.length === 1 ? "Current question" : "Part (" + alphabet[attempt.part] + ")")
      + (selected ? '<span class="selection-count">' + selected + ' line' + (selected===1?"":"s") + " selected</span>" : "")
      + '</div><div class="check-buttons">' + button("hint","Hint",{className:"action-quiet",iconName:"hint"})
      + button("solution","Solution",{className:"action-quiet"})
      + button("check",part.checks.length ? "Check work" : "Review work",{className:"action-primary",iconName:"check"}) + "</div></div>"
      + markupMessage(feedback,part);
  }

  function literal(value) { return {kind:"text",value:String(value)}; }
  function call(name,count) {
    return {kind:"call",name,count,...Object.fromEntries(Array.from({length:count},(_,i)=>["arg"+i,[]]))};
  }

  function tokensOf(node) {
    if (node.type === "number") return [literal(node.value)];
    if (node.type === "variable") return [literal(node.name)];
    if (node.type === "group") return [{kind:"group",body:tokensOf(node.value)}];
    if (node.type === "unary") return [literal(node.op),...tokensOf(node.right)];
    if (node.type === "binary") {
      if (node.op === "/") return [{kind:"frac",top:tokensOf(M.ungroup(node.left)),bottom:tokensOf(M.ungroup(node.right))}];
      if (node.op === "^") return [...tokensOf(node.left),{kind:"power",body:tokensOf(M.ungroup(node.right))}];
      return [...tokensOf(node.left),literal(node.op),...tokensOf(node.right)];
    }
    if (node.name === "sqrt") return [{kind:"root",body:tokensOf(node.args[0])}];
    if (node.name === "root") return [{kind:"nthroot",index:tokensOf(node.args[1]),body:tokensOf(node.args[0])}];
    const fn = call(node.name,node.args.length);
    node.args.forEach((arg,i) => fn["arg"+i] = tokensOf(arg));
    return [fn];
  }

  function codeOf(sequence) {
    let result = "";
    let previous = "";
    for (const token of sequence) {
      if (token.kind === "text") {
        const value = token.value;
        const numberChunk = /^[0-9.]+$/.test(value) && /^[0-9.]+$/.test(previous);
        result += (numberChunk ? "" : " ") + value;
        previous = value;
        continue;
      }
      const body = name => codeOf(token[name]);
      const grouped = name => "(" + body(name) + ")";
      if (token.kind === "sub") {
        result += "_" + body("body").replace(/\s/g,"");
      } else if (token.kind === "group") {
        result += " " + grouped("body");
      } else if (token.kind === "frac") {
        result += " (" + grouped("top") + "/" + grouped("bottom") + ")";
      } else if (token.kind === "power") {
        result += "^" + grouped("body");
      } else if (token.kind === "root") {
        result += " sqrt" + grouped("body");
      } else if (token.kind === "nthroot") {
        result += " root(" + body("body") + "," + body("index") + ")";
      } else if (token.kind === "call") {
        result += " " + token.name + "(" + nodeSlots(token).map(body).join(",") + ")";
      }
      previous = "";
    }
    return result.trim();
  }

  function ensureFocus() {
    const block = blockById(focus?.block);
    if (focus && sequenceAt(block,focus.field,focus.path)) return;
    setDefaultFocus();
    if (!focus) appendBlock("math");
  }

  function edit(work) {
    ensureFocus();
    work();
    const part = active.attempt.part;
    delete active.attempt.feedback[part];
    const wasPassed = Boolean(active.attempt.passed[part]);
    delete active.attempt.passed[part];
    message = null;
    save();
    renderSheet(true);
    if (wasPassed) renderProblem();
    renderCheck();
  }

  function insert(atoms, enter=false) {
    edit(() => {
      const block = blockById(focus.block);
      const {field,path,offset} = focus;
      const seq = sequenceAt(block,field,path);
      seq.splice(offset,0,...atoms);
      const slots = atoms.length === 1 && enter ? nodeSlots(atoms[0]) : [];
      if (slots.length) setFocus(block,field,[...path,offset,slots[0]],0);
      else setFocus(block,field,path,offset+atoms.length);
    });
  }

  function template(value) {
    switch (value) {
      case "frac": return {kind:"frac",top:[],bottom:[]};
      case "root": case "power": case "sub": case "group": return {kind:value,body:[]};
      case "nthroot": return {kind:"nthroot",index:[],body:[]};
      case "D": case "prime": case "diff": return call(value,2);
      case "D2": return call(value,3);
      case "ln": case "abs": case "exp": return call(value,1);
      default: return literal(value);
    }
  }

  function appendBlock(kind) {
    const block = newBlock(kind);
    active.attempt.blocks.push(block);
    const field = firstField(block);
    if (field) setFocus(block,field);
    return block;
  }

  function chooseEntry(entry, target, coordinate) {
    const block = blockById(entry.dataset.entry);
    const closest = target.closest("[data-sequence]") || entry.querySelector("[data-sequence]");
    if (!closest || !block) return;
    const field = closest.dataset.field;
    const path = closest.dataset.sequence ? closest.dataset.sequence.split(".") : [];
    const index = target.closest("[data-atom]");
    const seq = sequenceAt(block,field,path);
    if (!seq) return;
    let offset = seq.length;
    if (index && index.parentElement === closest) {
      const rect = index.getBoundingClientRect();
      offset = Number(index.dataset.atom) + (coordinate >= rect.left+rect.width/2 ? 1 : 0);
    }
    setFocus(block,field,path,offset);
    renderSheet(true);
  }

  function jumpOut(block,field,path,after=true) {
    if (!path.length) return false;
    setFocus(block,field,path.slice(0,-2),Number(path.at(-2))+(after ? 1 : 0));
    return true;
  }

  function moveSlot(direction) {
    if (!focus) return;
    const {block:idValue,field,path,offset} = focus;
    const block = blockById(idValue);
    const seq = sequenceAt(block,field,path);
    if (direction === "out") {
      jumpOut(block,field,path);
    } else if (direction === "left" || direction === "right") {
      const next = offset+(direction==="left"?-1:1);
      if (next>=0 && next<=seq.length) setFocus(block,field,path,next);
      else jumpOut(block,field,path,direction==="right");
    } else if (!path.length) {
      let index = seq.findIndex((token,i)=>i>=offset && nodeSlots(token).length);
      if (index<0) index = seq.findIndex(token=>nodeSlots(token).length);
      if (index>=0) setFocus(block,field,[index,nodeSlots(seq[index])[0]],0);
      else if (block.kind==="matrix") {
        const [,row,col] = field.split(":").map(Number);
        const position = row*block.cols+col+1;
        if (position<block.rows*block.cols) setFocus(block,"m:"+Math.floor(position/block.cols)+":"+position%block.cols);
      } else if (block.kind==="case" && field.endsWith(":condition")) {
        setFocus(block,field.replace(/condition$/,"result"));
      }
    } else {
      const parent = path.slice(0,-2);
      const index = Number(path.at(-2));
      const slots = nodeSlots(sequenceAt(block,field,parent)[index]);
      const nextSlot = slots[slots.indexOf(path.at(-1))+1];
      if (nextSlot) setFocus(block,field,[...parent,index,nextSlot],0);
      else jumpOut(block,field,path);
    }
    renderSheet(true);
  }

  function backspace() {
    if (!focus) return;
    const {block:idValue,field,path,offset} = focus;
    const block = blockById(idValue);
    if (!offset) {
      if (jumpOut(block,field,path,false)) renderSheet(true);
      return;
    }
    edit(() => {
      sequenceAt(block,field,path).splice(offset-1,1);
      setFocus(block,field,path,offset-1);
    });
  }

  function insertGiven(given) {
    if (!given) return;
    if (given.rows) {
      const block = appendBlock("matrix");
      block.rows = given.rows.length;
      block.cols = given.rows[0].length;
      block.cells = given.rows.map(row => row.map(value => tokensOf(M.parse(String(value)))));
      save();
      renderSheet(true);
      return;
    }
    try { insert(tokensOf(M.parse(given.code))); }
    catch { setMessage("retry","This expression can be entered using the math keyboard."); }
  }

  function resizeMatrix(block) {
    block.cells = Array.from({length:block.rows},(_,i) => Array.from({length:block.cols},(_,j) => block.cells[i]?.[j] || []));
    if (focus?.block === block.id && !rootSequence(block,focus.field)) setFocus(block,"m:0:0");
  }

  function shapeExists(block) {
    if (block.kind === "math") return block.expression.length > 0;
    if (block.kind === "matrix") return block.cells.some(row=>row.some(cell=>cell.length));
    if (block.kind === "case") return block.cases.some(item=>item.condition.length || item.result.length);
    if (block.kind === "graph") return block.shapes.length > 0;
    return block.text.trim().length > 0;
  }

  function answersOf(block) {
    if (block.kind === "math") return [codeOf(block.expression)];
    if (block.kind === "matrix") return [block.cells.map(row=>row.map(codeOf))];
    if (block.kind === "case") return block.cases.flatMap(item=>[codeOf(item.condition),codeOf(item.result)]);
    return [];
  }

  function setMessage(kind,text,extra={},keep=false) {
    message = {kind,text,...extra};
    if (keep) active.attempt.feedback[active.attempt.part] = message;
    renderCheck();
  }

  function checkWork() {
    const {attempt,generated} = active;
    const part = generated.parts[attempt.part];
    const selection = attempt.blocks.filter(block=>block.selected);
    const work = (selection.length ? selection : attempt.blocks).filter(shapeExists);
    if (!work.length) {
      setMessage("retry",selection.length ? "Add work to your selected lines first." : "Add your work to the notebook before checking.");
      return;
    }
    if (!part.checks.length) {
      setMessage("review","Compare your reasoning with the following reference when you’re ready.",{solution:true});
      return;
    }
    const answer = M.assess(work.flatMap(answersOf).filter(item=>item.length),part.checks,generated.assumptions);
    if (answer.matches === answer.total) {
      attempt.passed[attempt.part] = true;
      setMessage("correct","Your formula work matches this part. Include any explanation or sketch the prompt asks for.",{},true);
    } else {
      delete attempt.passed[attempt.part];
      setMessage("retry",answer.matches ? answer.matches + " of " + answer.total + " expected results matched. Use a separate line for each result."
        : "The checker couldn’t match your work for this part. Select the relevant lines and check your notation.",{hint:true},true);
    }
    save();
    renderProblem();
  }

  const board = {w:440,h:235,left:34,right:18,top:14,bottom:30};
  const colors = ["#5747c5","#0c806c","#ab5425","#245fbc","#a23d72"];

  function position(graph,x,y) {
    const width = board.w-board.left-board.right;
    const height = board.h-board.top-board.bottom;
    return [board.left+width*(x-graph.xMin)/(graph.xMax-graph.xMin),board.top+height*(graph.yMax-y)/(graph.yMax-graph.yMin)];
  }

  function svgPoint(point) { return point.map(value=>Math.round(value*100)/100).join(" "); }
  function displayNumber(value) { return Number(value.toFixed(2)); }
  function svgLine(a,b,style) {
    return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" '+style+'/>';
  }

  function plotPath(graph,expression) {
    let tree;
    const horizontal = M.normalize(graph.xLabel) || "x";
    const vertical = M.normalize(graph.yLabel) || "y";
    try {
      tree = M.ungroup(M.parse(expression));
      if (M.relation(tree)) {
        if (M.ungroup(tree.left).name === vertical) tree = tree.right;
        else if (M.ungroup(tree.right).name === vertical) tree = tree.left;
        else return "";
      }
    } catch { return ""; }

    const steps = 96;
    let path = "";
    let previous = null;
    for (let i=0;i<=steps;i+=1) {
      const x = graph.xMin+(graph.xMax-graph.xMin)*i/steps;
      const y = M.at(tree,{[horizontal]:x});
      if (!Number.isFinite(y) || Math.abs(y-graph.yMin)>50*(graph.yMax-graph.yMin)) {
        previous = null;
        continue;
      }
      const point = position(graph,x,y);
      const discontinuity = previous!==null && Math.abs(previous-y)>2*(graph.yMax-graph.yMin);
      path += (previous===null || discontinuity ? "M" : "L") + svgPoint(point) + " ";
      previous = y;
    }
    return path;
  }

  function renderShape(graph,shape,index) {
    const color = colors[index%colors.length];
    const points = shape.points?.map(point=>position(graph,point.x,point.y)) || [];
    const coords = points.map(svgPoint);
    const line = ' fill="none" stroke="'+color+'" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"';
    let art = "";
    switch (shape.kind) {
      case "point": art = '<circle cx="'+points[0][0]+'" cy="'+points[0][1]+'" r="4.1" fill="'+color+'"/>'; break;
      case "segment": art = '<path d="M'+coords[0]+' L'+coords[1]+'"'+line+'/>'; break;
      case "curve": {
        const [a,b,c] = points;
        const control = [2*b[0]-(a[0]+c[0])/2,2*b[1]-(a[1]+c[1])/2];
        art = '<path d="M'+coords[0]+' Q'+svgPoint(control)+' '+coords[2]+'"'+line+'/>';
        break;
      }
      case "region": art = '<polygon points="'+coords.join(" ")+'" fill="'+color+'" fill-opacity=".17" stroke="'+color+'" stroke-width="1.4"/>'; break;
      case "plot": art = '<path d="'+plotPath(graph,shape.expression)+'"'+line+'/>'; break;
    }
    if (shape.label && points.length) {
      const [x,y] = points[shape.kind==="point" ? 0 : Math.floor(points.length/2)];
      art += '<text class="graph-label" x="'+(x+7)+'" y="'+(y-6)+'">'+M.escape(shape.label)+'</text>';
    }
    return art;
  }

  function graphArt(graph) {
    const zeroX = Math.max(graph.xMin,Math.min(0,graph.xMax));
    const zeroY = Math.max(graph.yMin,Math.min(0,graph.yMax));
    const [axisX,axisY] = position(graph,zeroX,zeroY);
    let marks = "";
    for (let i=0;i<=5;i+=1) {
      const x = graph.xMin+(graph.xMax-graph.xMin)*i/5;
      const y = graph.yMin+(graph.yMax-graph.yMin)*i/5;
      marks += svgLine(position(graph,x,graph.yMin),position(graph,x,graph.yMax),'stroke="#e6eaf5"');
      marks += svgLine(position(graph,graph.xMin,y),position(graph,graph.xMax,y),'stroke="#e6eaf5"');
      marks += '<text text-anchor="middle" x="'+position(graph,x,0)[0]+'" y="'+(board.h-14)+'">'+displayNumber(x)+'</text>';
      marks += '<text text-anchor="end" x="'+(board.left-5)+'" y="'+(position(graph,0,y)[1]+3)+'">'+displayNumber(y)+'</text>';
    }
    marks += svgLine([axisX,board.top],[axisX,board.h-board.bottom],'stroke="#8a98ba" stroke-width="1.35"');
    marks += svgLine([board.left,axisY],[board.w-board.right,axisY],'stroke="#8a98ba" stroke-width="1.35"');
    marks += '<text class="graph-label" x="'+(board.w-7)+'" y="'+(board.h-14)+'" text-anchor="end">'+M.escape(graph.xLabel)+'</text>';
    marks += '<text class="graph-label" x="'+(axisX+6)+'" y="12">'+M.escape(graph.yLabel)+'</text>';
    const clip = "clip-"+graph.id;
    const draft = graph.pending.map(point=>{
      const [x,y] = position(graph,point.x,point.y);
      return '<circle cx="'+x+'" cy="'+y+'" r="3.3" fill="#6658d7"/>';
    }).join("");
    return '<svg class="graph-grid" role="img" aria-label="Graph. Choose a drawing tool and click to place points." viewBox="0 0 '+board.w+' '+board.h+'"'
      +attrs({action:"graph-point",block:graph.id})+'><defs><clipPath id="'+clip+'"><rect x="'+board.left+'" y="'+board.top
      +'" width="'+(board.w-board.left-board.right)+'" height="'+(board.h-board.top-board.bottom)+'"/></clipPath></defs>'
      +marks+'<g clip-path="url(#'+clip+')">'+graph.shapes.map((shape,index)=>renderShape(graph,shape,index)).join("")+draft+'</g></svg>';
  }

  const drawingModes = {point:"Point",segment:"Line",curve:"Curve",region:"Region"};
  const drawingHelp = {point:"Click once to place a point.",segment:"Click two points to draw a line segment.",
    curve:"Click a start, midpoint, and end to draw a curve.",region:"Click at least three vertices, then close the region."};

  function graphEditor(graph) {
    const tools = Object.entries(drawingModes).map(([mode,label]) => button("graph-tool",label,{
      className:"action-small"+(graph.mode===mode?" is-active":""),data:{block:graph.id,mode},pressed:graph.mode===mode
    })).join("");
    const input = (name,label,type="number") => '<label>'+label+'<input type="'+type+'" value="'+M.escape(graph[name])+'"'
      + (type==="text"?' maxlength="12"':' step="any"') +attrs({change:"axis",block:graph.id,name})+'></label>';
    const formulaLines = active.attempt.blocks.filter(block=>block.kind==="math"&&block.expression.length);
    const plotOptions = formulaLines.map(block=>'<option value="'+block.id+'"'+(graph.plotSource===block.id?" selected":"")+'>Line '+(active.attempt.blocks.indexOf(block)+1)+'</option>').join("");
    const plotControls = formulaLines.length
      ? '<label><select aria-label="Formula line to plot" data-change="plot-source"'+attrs({block:graph.id})
        +'><option value="">Equation</option>'+plotOptions+'</select></label>'+button("graph-plot","Plot",{className:"action-small",data:{block:graph.id}})
      : "";
    const axis = '<details class="graph-settings" data-graph-settings="'+graph.id+'"'+(graph.axesOpen?" open":"")+'><summary>Axes and scale</summary>'
      +'<div class="axis-fields">'+input("xLabel","Horizontal","text")+input("xMin","Min x")+input("xMax","Max x")
      +input("yLabel","Vertical","text")+input("yMin","Min y")+input("yMax","Max y")+'</div><div class="graph-footer">'
      +'<label><input type="checkbox" data-change="axis"'+attrs({block:graph.id,name:"snap"})+(graph.snap?" checked":"")+' > Snap to integers</label></div></details>';
    return '<div class="graph-tools">'+tools+button("graph-undo","Undo",{className:"action-small action-quiet",data:{block:graph.id},
      disabled:!graph.pending.length&&!graph.shapes.length})+'</div>'+graphArt(graph)
      +'<div class="graph-footer"><label>Label<input type="text" data-input="graph-label" maxlength="24" value="'+M.escape(graph.label)+'"'
      +attrs({block:graph.id})+' aria-label="Label for the next drawing"></label>'+plotControls
      +(graph.mode==="region" ? button("graph-close","Close region",{className:"action-small",data:{block:graph.id},disabled:graph.pending.length<3}) : "")
      +'</div><p class="graph-hint">'+(graph.error?M.escape(graph.error):drawingHelp[graph.mode])+'</p>'+axis;
  }

  function addGraphShape(graph,kind,points) {
    graph.shapes.push({kind,points,label:graph.label});
    graph.label = "";
    graph.pending = [];
    graph.error = "";
  }

  function pointOnGraph(graph,event,svg) {
    const screen = svg.getScreenCTM();
    if (!screen) return;
    const transformed = new DOMPoint(event.clientX,event.clientY).matrixTransform(screen.inverse());
    const u = (transformed.x-board.left)/(board.w-board.left-board.right);
    const v = (transformed.y-board.top)/(board.h-board.top-board.bottom);
    if (u<0 || u>1 || v<0 || v>1) return;
    const approximate = graph.snap ? Math.round : displayNumber;
    const point = {x:approximate(graph.xMin+u*(graph.xMax-graph.xMin)),y:approximate(graph.yMax-v*(graph.yMax-graph.yMin))};
    graph.pending.push(point);
    const pointsNeeded = {point:1,segment:2,curve:3}[graph.mode];
    if (graph.pending.length===pointsNeeded) addGraphShape(graph,graph.mode,graph.pending);
    save();
    renderSheet();
  }

  function chooseSection(section) {
    state.section = section;
    keypadPage = "basic";
    renderPage();
    window.scrollTo({top:0});
  }

  function handleClick(event) {
    const control = event.target.closest("[data-action]");
    if (!control) {
      const entry = event.target.closest("[data-entry]");
      if (entry) chooseEntry(entry,event.target,event.clientX);
      return;
    }
    const {action,value,block:targetId,kind,mode} = control.dataset;
    const block = blockById(targetId);
    const attempt = active.attempt;
    const part = active.generated.parts[attempt.part];
    switch (action) {
      case "navigate": chooseSection(control.dataset.section); return;
      case "choose-exercise": state.choices[active.sectionKey] = Number(value); keypadPage = "basic"; renderPage(); return;
      case "skill-mode": state.mode=value; keypadPage = "basic"; renderPage(); return;
      case "original": state.variants[active.baseKey]=0; renderPage(); return;
      case "variant": {
        if (!active.chapter && state.mode==="mixed") {
          const next = (active.exerciseIndex+1)%active.list.length;
          state.choices[active.sectionKey] = next;
          const nextKey = active.sectionKey+"-"+next;
          state.variants[nextKey] = (state.variants[nextKey]||0)+1;
        } else {
          const latestKey = active.baseKey+"-last";
          const next = Math.max(active.version,state.variants[latestKey]||0)+1;
          state.variants[latestKey] = next;
          state.variants[active.baseKey] = next;
        }
        renderPage();
        return;
      }
      case "choose-part":
        attempt.part = Number(control.dataset.part);
        message = null;
        save();
        renderProblem();
        renderCheck();
        return;
      case "insert-given": insertGiven(active.generated.givens[Number(control.dataset.index)]); return;
      case "keypad-page": keypadPage = value; renderKeypad(); return;
      case "insert-key": insert([template(value)],true); return;
      case "insert-symbol": {
        try { insert(tokensOf(M.parse(value))); } catch { insert([literal(value)]); }
        return;
      }
      case "slot-control": if (value==="back") backspace(); else moveSlot(value); return;
      case "check": checkWork(); return;
      case "hint": setMessage("help","Hint",{hint:true}); return;
      case "solution": setMessage("help","Reference solution",{solution:true}); return;
      case "mark-reviewed":
        attempt.passed[attempt.part] = true;
        setMessage("correct","Marked reviewed.",{},true);
        save();
        renderProblem();
        return;
      case "add-block": {
        const added = appendBlock(kind);
        save();
        renderSheet(Boolean(firstField(added)));
        if (kind==="note") document.querySelector('textarea[data-block="'+added.id+'"]')?.focus();
        document.querySelector('[data-block-box="'+added.id+'"]')?.scrollIntoView({block:"nearest"});
        return;
      }
      case "duplicate-block": {
        const copy = {...clone(block),id:id(),selected:false};
        attempt.blocks.splice(attempt.blocks.indexOf(block)+1,0,copy);
        const field = firstField(copy);
        if (field) setFocus(copy,field);
        break;
      }
      case "remove-block":
        attempt.blocks.splice(attempt.blocks.indexOf(block),1);
        if (!attempt.blocks.length) appendBlock("math");
        if (focus?.block===block.id) setDefaultFocus();
        break;
      case "select-block":
        block.selected = !block.selected;
        message = null;
        break;
      case "add-case": {
        const item = newCase();
        block.cases.push(item);
        setFocus(block,"c:"+item.id+":condition");
        break;
      }
      case "remove-case":
        block.cases = block.cases.filter(item=>item.id!==control.dataset.case);
        if (focus?.block===block.id) setFocus(block,firstField(block));
        break;
      case "graph-tool":
        block.mode = mode;
        block.pending = [];
        block.error = "";
        break;
      case "graph-undo":
        if (block.pending.length) block.pending.pop(); else block.shapes.pop();
        block.error = "";
        break;
      case "graph-close":
        if (block.pending.length>=3) addGraphShape(block,"region",block.pending);
        break;
      case "graph-point": pointOnGraph(block,event,control); return;
      case "graph-plot": {
        const expression = blockById(block.plotSource)?.expression;
        if (!expression || !plotPath(block,codeOf(expression))) {
          block.error = "Choose a line containing the vertical variable as a function of the horizontal one. Use numeric parameters.";
        } else {
          block.shapes.push({kind:"plot",expression:codeOf(expression)});
          block.error = "";
        }
        break;
      }
      default: return;
    }
    if (action==="remove-block" || action==="remove-case") {
      delete attempt.feedback[attempt.part];
      delete attempt.passed[attempt.part];
      message = null;
      renderProblem();
    }
    save();
    renderSheet(Boolean(focus && ["duplicate-block","add-case"].includes(action)));
    renderCheck();
  }

  function handleInput(event) {
    const element = event.target;
    const block = blockById(element.dataset.block);
    if (!block) return;
    switch (element.dataset.input) {
      case "note": block.text = element.value; break;
      case "case-title": block.cases.find(item=>item.id===element.dataset.case).title = element.value; break;
      case "graph-label": block.label = element.value; break;
      default: return;
    }
    save();
  }

  function handleChange(event) {
    const element = event.target;
    const block = blockById(element.dataset.block);
    const name = element.dataset.name;
    if (element.dataset.change==="mobile-nav") {
      chooseSection(element.value);
      return;
    }
    if (!block) return;
    switch (element.dataset.change) {
      case "matrix-size": block[name] = Number(element.value); resizeMatrix(block); break;
      case "plot-source": block.plotSource = element.value; save(); return;
      case "axis": {
        const next = element.type==="number" ? Number(element.value) : element.type==="checkbox" ? element.checked : element.value;
        if (element.type==="number") {
          const axis = name[0];
          const other = block[axis+(name.endsWith("Min")?"Max":"Min")];
          if (!element.value || !Number.isFinite(next) || (name.endsWith("Min") ? next>=other : next<=other)) {
            element.value = block[name];
            return;
          }
        }
        block[name] = next;
        break;
      }
      default: return;
    }
    save();
    renderSheet();
  }

  function handleKeys(event) {
    const entry = event.target.closest("[data-entry]");
    if (!entry || event.altKey || event.ctrlKey || event.metaKey) return;
    const block = blockById(entry.dataset.entry);
    if (!focus || focus.block!==block.id || focus.field!==entry.dataset.field) setFocus(block,entry.dataset.field);
    const {key} = event;
    const aliases = {"/":"frac","^":"power","_":"sub","(":"group"};
    if (key==="Backspace") backspace();
    else if (key==="ArrowLeft") moveSlot("left");
    else if (key==="ArrowRight") moveSlot("right");
    else if (key==="Escape" || key===")") moveSlot("out");
    else if (key==="Tab" && !event.shiftKey && focus.path.length) moveSlot("next");
    else if (key==="Enter") {
      if (focus.path.length) moveSlot("next");
      else if (block.kind==="math") { appendBlock("math"); save(); renderSheet(true); }
      else moveSlot("next");
    } else if (key in aliases) insert([template(aliases[key])],true);
    else if (/^[a-zA-Z0-9.=+*<>,%-]$/.test(key) && key!=="%") insert([literal(key)]);
    else return;
    event.preventDefault();
  }

  root.addEventListener("click",handleClick);
  root.addEventListener("input",handleInput);
  root.addEventListener("change",handleChange);
  root.addEventListener("keydown",handleKeys);
  root.addEventListener("toggle",event=>{
    const block = blockById(event.target.dataset.graphSettings);
    if (block) block.axesOpen = event.target.open;
  },true);

  renderPage();
})();

</script>
</body>
</html>
